[project]
name = "molcalib"
version = "0.0.0"
description = "Benchmarking uncertainty quantification (deep ensembles, MC dropout, conformal prediction) on scaffold-split TDC ADMET tasks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "matplotlib",
    "rdkit",
    "pytdc",
    "setuptools<81",  # PyTDC 0.4.1 imports pkg_resources (removed in setuptools 82)
]

[project.optional-dependencies]
# GNN training stack (torch comes in via chemprop). Local CPU torch: make setup-cpu
deep = [
    "chemprop",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
