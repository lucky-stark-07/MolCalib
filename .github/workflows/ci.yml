name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.11"
          cache: true
      - run: pdm install -G deep
      - run: pip install uv && ./scripts/install_cpu_torch.sh
      - run: pdm run ruff check
      - run: pdm run pytest
